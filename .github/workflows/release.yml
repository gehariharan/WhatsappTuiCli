name: Build prebuilt installers

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 0.1.0-preview.1); creates a draft prerelease"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  version:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Validate release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]; then
            echo "Invalid version" >&2
            exit 1
          fi
          # Create the immutable release tag while this commit is still HEAD.
          # A later release upload then needs only the normal contents permission.
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              echo "Release tag already points to a different commit" >&2
              exit 1
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin_arm64
          - runner: macos-15-intel
            platform: darwin_amd64
          - runner: ubuntu-22.04
            platform: linux_amd64
          - runner: ubuntu-22.04-arm
            platform: linux_arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test storage, filtering, and integration
        run: go test -tags sqlite_fts5 ./...
      - name: Build native release packages
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
        run: bash scripts/package.sh "$PACKAGE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/${{ needs.version.outputs.value }}/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare native Windows packaging tools
        shell: pwsh
        run: |
          & C:/msys64/usr/bin/bash.exe -lc 'pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc'
          if ($LASTEXITCODE -ne 0) { throw 'C compiler installation failed' }
          'C:/msys64/ucrt64/bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          'CC=C:/msys64/ucrt64/bin/gcc.exe' | Out-File -FilePath $env:GITHUB_ENV -Append
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build Windows executable, portable ZIP and installer
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
        run: ./scripts/package-windows.ps1 -Version $env:PACKAGE_VERSION
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows_amd64
          path: dist/${{ needs.version.outputs.value }}/windows_amd64/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [version, build, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release
      - name: Generate Homebrew cask and checksums
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          extra=()
          if [[ "$PRIVATE_REPOSITORY" == "true" ]]; then extra+=(--private); fi
          python3 scripts/homebrew-cask.py "$PACKAGE_VERSION" dist/release dist/release/wasync.rb "${extra[@]}"
          cd dist/release
          sha256sum ./*.tar.gz ./*.pkg ./*.zip ./*.exe > checksums.txt
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
        shell: bash
        run: |
          tag="v$PACKAGE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A release for $tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          cat > dist/release/RELEASE_NOTES.md <<'NOTES'
          Prebuilt preview packages. No Go compiler is required on the user's computer.

          - macOS 15+: download the matching darwin_arm64 (Apple Silicon) or darwin_amd64 (Intel) .pkg and open it. Then run `wasync` in Terminal.
          - Linux: download the matching linux archive; extract and install the executable into a directory on PATH. Builds target glibc 2.35 or newer.
          - `wasync query --help` documents the agent query interface.
          - Verify downloads against checksums.txt.

          Unpublished build-stage artifacts. Mac packages must pass the signing, notarization, and signed verification stages before publication.
          The generated wasync.rb is a binary-only Homebrew cask. Private releases use GitHub CLI authentication.
          Installation preserves existing per-user archives and pairing credentials.
          NOTES
          gh release create "$tag" --draft --prerelease --verify-tag \
            --title "wasync $PACKAGE_VERSION" --notes-file dist/release/RELEASE_NOTES.md \
            dist/release/*.tar.gz dist/release/*.pkg dist/release/*.zip dist/release/*.exe dist/release/checksums.txt dist/release/wasync.rb
