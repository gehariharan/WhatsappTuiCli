name: Build prebuilt installers

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 0.1.0-preview.1); creates a draft prerelease"
        required: true
        type: string
      publish:
        description: "Publish the private prerelease, update the tap, and run Homebrew E2E checks"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  version:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      value: ${{ steps.version.outputs.value }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Validate release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        shell: bash
        run: |
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]; then
            echo "Invalid version" >&2
            exit 1
          fi
          # Create the immutable release tag while this commit is still HEAD.
          # A later release upload then needs only the normal contents permission.
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              echo "Release tag already points to a different commit" >&2
              exit 1
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin_arm64
          - runner: macos-15-intel
            platform: darwin_amd64
          - runner: ubuntu-22.04
            platform: linux_amd64
          - runner: ubuntu-22.04-arm
            platform: linux_arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test storage, filtering, and integration
        run: go test -tags sqlite_fts5 ./...
      - name: Build native release packages
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
        run: bash scripts/package.sh "$PACKAGE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/${{ needs.version.outputs.value }}/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release
      - name: Generate Homebrew cask and checksums
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          extra=()
          if [[ "$PRIVATE_REPOSITORY" == "true" ]]; then extra+=(--private); fi
          python3 scripts/homebrew-cask.py "$PACKAGE_VERSION" dist/release dist/release/wasync.rb "${extra[@]}"
          cd dist/release
          sha256sum ./*.tar.gz ./*.pkg > checksums.txt
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
        shell: bash
        run: |
          tag="v$PACKAGE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A release for $tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          cat > dist/release/RELEASE_NOTES.md <<'NOTES'
          Prebuilt preview packages. No Go compiler is required on the user's computer.

          - macOS 15+: download the matching darwin_arm64 (Apple Silicon) or darwin_amd64 (Intel) .pkg and open it. Then run `wasync` in Terminal.
          - Linux: download the matching linux archive; extract and install the executable into a directory on PATH. Builds target glibc 2.35 or newer.
          - `wasync query --help` documents the agent query interface.
          - Verify downloads against checksums.txt.

          These preview macOS packages are unsigned and not notarized. The maintainer must configure Apple Developer signing and notarization before general public distribution.
          The generated wasync.rb is a binary-only Homebrew cask. Private releases use GitHub CLI authentication.
          Installation preserves existing per-user archives and pairing credentials.
          NOTES
          gh release create "$tag" --draft --prerelease --verify-tag \
            --title "wasync $PACKAGE_VERSION" --notes-file dist/release/RELEASE_NOTES.md \
            dist/release/*.tar.gz dist/release/*.pkg dist/release/checksums.txt dist/release/wasync.rb
      - name: Publish prerelease for Homebrew
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
        run: gh release edit "v$PACKAGE_VERSION" --draft=false --prerelease

  publish-tap:
    needs: [version, release]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download release cask
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
        run: gh release download "v$PACKAGE_VERSION" --pattern wasync.rb --dir dist/release
      - name: Update tap with repository-scoped deploy key
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: bash scripts/publish-tap.sh dist/release

  homebrew-e2e:
    needs: [version, publish-tap]
    if: needs.version.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install from the private tap and query a synthetic archive
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        shell: bash
        run: |
          source scripts/tap-ssh.sh
          trap 'rm -rf "$tap_ssh_dir"' EXIT
          brew tap gehariharan/tap git@github.com:gehariharan/homebrew-tap.git
          if brew help trust >/dev/null 2>&1; then brew trust --cask gehariharan/tap/wasync; fi
          # Explicitly test this unsigned preview. Production signing is separate.
          brew install --cask --no-quarantine gehariharan/tap/wasync
          python3 scripts/smoke-installed.py "$(brew --prefix)/bin/wasync" "$PACKAGE_VERSION" "$EXPECTED_ARCHITECTURE"
